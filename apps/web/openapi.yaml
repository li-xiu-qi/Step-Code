openapi: 3.1.0
info:
  title: StepCode Web Host
  version: 0.1.0
  description: Loopback-only browser host for the StepCode AgentSessionRuntime.
servers:
  - url: http://127.0.0.1:3077
paths:
  /healthz:
    get:
      security: []
      responses:
        "200":
          description: Host is running
  /auth/exchange:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "200": { description: Set signed HttpOnly cookie }
        "401": { description: Invalid or reused launch token }
  /auth/logout:
    post:
      security: []
      responses:
        "200": { description: Expire the StepCode Web authentication cookie }
        "403": { description: Origin is not allowed }
  /api/v1/bootstrap:
    get:
      responses:
        "200":
          description: Launch folder and which folder picker the page should offer
          content:
            application/json:
              schema:
                type: object
                properties:
                  cwd: { type: string, description: Launch working directory }
                  directoryPicker: { type: string, enum: [native, browse] }
                  login: { $ref: "#/components/schemas/LoginReport" }
  /api/v1/login:
    get:
      description: |
        Where the model credential comes from. Signing in writes auth.json, from
        a terminal (`step login`) or from the sign-in dialog of Web and Desktop (the routes
        below); this host reads the same file. The response carries the source,
        provider and profile — never the credential — plus the command that
        changes it.
      responses:
        "200":
          description: Credential source
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LoginReport" }
  /api/v1/login/methods:
    get:
      description: The four `step login` profiles, for the sign-in dialog.
      responses:
        "200":
          description: Sign-in methods
          content:
            application/json:
              schema:
                type: object
                properties:
                  methods:
                    type: array
                    items: { $ref: "#/components/schemas/LoginMethod" }
  /api/v1/login/api-key:
    post:
      description: |
        Validate a platform API key against its region (GET <base>/v1/models) and,
        only when accepted, save it to auth.json in the same shape `step login`
        writes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile, apiKey]
              properties:
                profile: { type: string, enum: [platform_cn, platform_oversea] }
                apiKey: { type: string }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  login: { $ref: "#/components/schemas/LoginReport" }
        "400": { description: "Bad input, or `code: invalid_key` when the provider rejected the key" }
        "502": { description: "`code: unavailable`: the provider could not be reached; nothing was saved" }
  /api/v1/login/browser:
    get:
      description: State of the Step Plan browser sign-in.
      responses:
        "200":
          description: Browser sign-in state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserLoginState" }
    post:
      description: |
        Start the Step Plan browser sign-in (the same cloud flow as `step login`)
        and answer with the authorize URL to open. Approval is awaited in the
        background; poll GET until `completed` or `failed`. Starting again
        cancels the previous attempt.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [profile]
              properties:
                profile: { type: string, enum: [step_plan, step_plan_oversea] }
      responses:
        "200":
          description: Pending, with authUrl
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BrowserLoginState" }
        "502": { description: "The sign-in could not be started (`code: failed`)" }
    delete:
      description: Cancel the pending browser sign-in; a later approval is ignored.
      responses:
        "200": { description: Cancelled }
  /api/v1/workspaces:
    get:
      responses:
        "200": { description: "Workspace navigation entries: path, name, available, optional hidden=true for explicitly removed folders. Hidden entries persist across reload; chats remain searchable and appear under Recent. Adding the folder clears hidden." }
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [path]
              properties:
                path: { type: string, description: Absolute folder path }
      responses:
        "201": { description: Workspace registered by its real path }
        "400": { description: Path is missing, does not exist, or is not a directory }
    delete:
      parameters:
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Workspace hidden persistently, including session-derived folders; idempotent for retries. Files and sessions untouched. }
        "404": { description: Path is missing or not absolute }
  /api/v1/workspaces/pick:
    post:
      description: |
        Open the operating system folder chooser on the Host and answer with the
        chosen absolute path, or null when the user cancels. Only available when
        the Host serves a loopback-bound desktop session; 409 otherwise, and 409
        while another dialog is already open. The dialog closes if the page goes
        away before the user answers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, description: Dialog title }
                startIn: { type: string, description: Folder to open at, ignored unless it exists }
      responses:
        "200": { description: "path is the chosen folder, or null when cancelled" }
        "409": { description: The system picker is unavailable or already open }
        "500": { description: The picker helper failed }
  /api/v1/workspace/files:
    get:
      parameters:
        - { name: cwd, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, schema: { type: string } }
      responses:
        "200": { description: "One directory level: entries (name, path, kind) and truncated" }
        "400": { description: Path is outside the workspace or cannot be read }
        "403": { description: cwd is not a known workspace }
  /api/v1/workspace/file:
    get:
      parameters:
        - { name: cwd, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "kind text|image|binary|too-large, path, size; content for text only" }
        "400": { description: Path is outside the workspace or is not a file }
        "403": { description: cwd is not a known workspace }
  /api/v1/workspace/raw:
    get:
      parameters:
        - { name: cwd, in: query, required: true, schema: { type: string } }
        - { name: path, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: Image bytes }
        "413": { description: Image exceeds the preview limit }
        "415": { description: File is not an image }
  /api/v1/workspace/search:
    get:
      parameters:
        - { name: cwd, in: query, required: true, schema: { type: string } }
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "Name matches below the workspace root: entries and truncated" }
  /api/v1/models:
    get:
      description: >-
        Model panel of an unsaved draft: the catalog and the model and thinking level a new session in `cwd` would
        start on (settings default, then the Step product default). An unknown `cwd` falls back to the launch folder.
        Each model carries `thinkingLevels` so the panel can show effort for a model picked before the session exists.
      parameters:
        - { name: cwd, in: query, schema: { type: string } }
      responses:
        "200":
          description: Draft model source
          content:
            application/json:
              schema:
                type: object
                required: [models, availableThinkingLevels]
                properties:
                  model:
                    type: object
                    properties: { provider: { type: string }, id: { type: string } }
                  thinkingLevel: { type: string }
                  availableThinkingLevels: { type: array, items: { type: string } }
                  models: { type: array, items: { type: object } }
  /api/v1/sessions:
    get:
      responses:
        "200": { description: Session list grouped by cwd by the client }
    post:
      responses:
        "201": { description: New StepCode v3 session }
  /api/v1/directories:
    get:
      parameters:
        - name: path
          in: query
          schema: { type: string }
      responses:
        "200": { description: Absolute directory and immediate child folders }
  /api/v1/sessions/{id}:
    get:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200":
          description: Session snapshot including pendingClarifications (in-memory requests restored after page reload)
          content:
            application/json:
              schema:
                type: object
                properties:
                  pendingClarifications:
                    type: array
                    items: { $ref: "#/components/schemas/ClarificationRequest" }
                  pendingApprovals:
                    type: array
                    items: { $ref: "#/components/schemas/ApprovalRequest" }
    delete:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Session deleted }
  /api/v1/sessions/{id}/events:
    get:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: "SSE snapshot and agent/status/approval/clarification_required/clarification_resolved events. Required carries clarification; resolved carries id." }
  /api/v1/sessions/{id}/messages:
    post:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "202": { description: Prompt accepted }
        "409": { description: A turn revert is writing files }
  /api/v1/sessions/{id}/steer:
    post:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "202": { description: Steer accepted }
  /api/v1/sessions/{id}/interrupt:
    post:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Agent interrupted }
  /api/v1/sessions/{id}/name:
    patch:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Renamed session snapshot }
  /api/v1/sessions/{id}/archive:
    patch:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Archived or restored session snapshot }
  /api/v1/sessions/{id}/approvals/decision:
    post:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Approval decision accepted }
        "404": { description: Approval no longer pending }
  /api/v1/sessions/{id}/skills:
    get:
      description: Skills the composer offers as `/skill:<name>` (empty when skill commands are disabled).
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200":
          description: Skills by name
          content:
            application/json:
              schema:
                type: object
                properties:
                  skills:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        description: { type: string }
  /api/v1/workspace/skills:
    get:
      description: >-
        Skills for a folder without a session yet. Uses an open session in the same folder; otherwise resolves
        the folder's skill resources as a session would, without extensions (plugin skills are then missing).
      parameters:
        - { name: cwd, in: query, required: true, schema: { type: string } }
      responses:
        "200": { description: "Same shape as /api/v1/sessions/{id}/skills" }
        "403": { description: Folder is not a known workspace }
  /api/v1/mcp:
    get:
      description: >-
        MCP servers of the host process (one list, written by the session that started last), including servers
        disabled in config.toml.
      responses:
        "200":
          description: Server status
          content:
            application/json:
              schema:
                type: object
                properties:
                  servers:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        status: { type: string, enum: [connecting, connected, failed, disabled] }
                        toolCount: { type: integer }
                        error: { type: string }
  /api/v1/sessions/{id}/turns/{turnId}/revert:
    post:
      description: >-
        Reverse-apply the edit/write patches (tool result `details.patch`) of the turn that starts at
        user entry `turnId`. All or nothing over the patched files. Hunks may have moved (later edits elsewhere
        in the file) and their edge context may have changed, but the lines the turn changed must be intact.
        Successful edit/write calls without a patch (large or binary files) are left as they are and listed in
        `skipped`; changes made through `bash` are not tracked. A `stepcode-web.turn-revert` custom message then
        tells the model which files were restored and lists the turn in the snapshot's `revertedTurns`.
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
        - { name: turnId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Files restored
          content:
            application/json:
              schema:
                type: object
                properties:
                  snapshot: { type: object }
                  paths: { type: array, items: { type: string } }
                  skipped:
                    type: array
                    items:
                      type: object
                      required: [path, reason]
                      properties:
                        path: { type: string }
                        reason: { type: string, enum: [too_large, binary, unreadable, unknown] }
        "409":
          description: The revert was refused and nothing was written.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: string }
                  code: { type: string, enum: [busy, reverted, empty, missing, conflict] }
                  path: { type: string, description: The file that blocked it (missing, conflict) }
  /api/v1/sessions/{id}/policy:
    patch:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Persisted Step permission preset }
  /api/v1/sessions/{id}/clarifications/response:
    post:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, cancelled]
              properties:
                id: { type: string }
                cancelled: { type: boolean }
                answers:
                  description: Required unless cancelled. One reply per question, in request order.
                  type: array
                  items:
                    type: object
                    required: [id]
                    properties:
                      id: { type: string }
                    oneOf:
                      - properties: { optionIndex: { type: integer, minimum: 0 } }
                        required: [optionIndex]
                      - properties: { text: { type: string, minLength: 1 } }
                        required: [text]
                      - properties: { skipped: { const: true } }
                        required: [skipped]
      responses:
        "200": { description: Response accepted; resumes the existing clarify_user call }
        "400": { description: Invalid or incomplete answers; request remains pending }
        "404": { description: Request no longer pending in this session }
  /api/v1/sessions/{id}/model:
    patch:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Persisted model selection }
  /api/v1/sessions/{id}/files:
    get:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Workspace file tree }
  /api/v1/sessions/{id}/file:
    get:
      parameters:
        - { $ref: "#/components/parameters/SessionId" }
      responses:
        "200": { description: Workspace file contents }
components:
  schemas:
    ApprovalRequest:
      type: object
      required: [id, sessionId, toolName, message, createdAt]
      properties:
        id: { type: string }
        sessionId: { type: string }
        toolName: { type: string }
        message: { type: string, description: Original confirmation diagnostics }
        reason: { type: string, description: Specific policy reason without call and batch diagnostics }
        createdAt: { type: number }
        input:
          type: object
          additionalProperties: true
          description: Full captured arguments for displaying the command without clipping
        preview:
          type: object
          properties:
            path: { type: string }
            before: { type: string }
            after: { type: string }
    ClarificationRequest:
      type: object
      required: [id, sessionId, questions]
      properties:
        id: { type: string }
        sessionId: { type: string }
        questions:
          type: array
          items:
            type: object
            required: [id, label, question, options, allowFreeform]
            properties:
              id: { type: string }
              label: { type: string }
              question: { type: string }
              reason: { type: string }
              allowFreeform: { type: boolean }
              options:
                type: array
                items:
                  type: object
                  required: [label, value]
                  properties:
                    label: { type: string }
                    value: { type: string }
                    description: { type: string }
    LoginMethod:
      type: object
      required: [id, credentialSource, region, keyPageUrl]
      properties:
        id: { type: string, enum: [step_plan, step_plan_oversea, platform_cn, platform_oversea] }
        credentialSource: { type: string, enum: [browser, apiKey] }
        region: { type: string, enum: [cn, global] }
        keyPageUrl: { type: string, description: Where to create a platform API key }
    BrowserLoginState:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [idle, pending, completed, failed] }
        profile: { type: string }
        authUrl: { type: string, description: Authorize URL to open while pending }
        error: { type: string }
    LoginReport:
      description: |
        Where the model credential comes from. Never contains the credential.
        `configured` reports that one exists; `validity` reports what the
        provider said when it was checked.
      type: object
      required: [source, configured, loginCommand]
      properties:
        source: { type: string, enum: [environment, auth.json, none] }
        provider: { type: string, description: "Provider id the credential belongs to" }
        profile: { type: string, description: "Login profile recorded at sign-in" }
        path: { type: string, description: "Credential file, when one exists" }
        configured: { type: boolean, description: "A credential exists, whatever the provider said about it" }
        validity:
          type: string
          enum: [valid, invalid, unavailable, missing]
          description: "The provider's verdict; unavailable means it could not be reached"
        loginCommand: { type: string, description: "The command that changes this state" }
  parameters:
    SessionId:
      name: id
      in: path
      required: true
      schema: { type: string }
